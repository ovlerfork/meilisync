name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -f compose.yaml config --quiet
        env:
          MEILISYNC_SOURCE_HOST: mysql
          MEILISYNC_SOURCE_USER: root
          MEILISYNC_SOURCE_PASSWORD: secret
          MEILISYNC_SOURCE_DATABASE: test
          MEILISEARCH_API_URL: http://meilisearch:7700
          MEILISYNC_SYNC_TABLE: test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and configure Poetry
        run: |
          pip install -U pip poetry
          poetry config virtualenvs.create false
      - name: Install dependencies
        run: poetry install -E all
      - name: Check
        run: make check
